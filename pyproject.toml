[project]
name = "elport"
version = "0.1.0"
description = "Git-like sync CLI for eLabFTW (local-first push/pull of Markdown/HTML lab notes)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.31",
  "keyring>=25",
  "tomli-w>=1.0",
  "tomli>=2.0; python_version < '3.11'",
  "pyyaml>=6.0",
]

[project.scripts]
elport = "elport.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16",
  "tomli>=2.0",
  "ty>=0.0.69",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
