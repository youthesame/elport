[project]
name = "elport"
# Version comes from the latest git tag (hatch-vcs). Don't set it here; release by tagging.
dynamic = ["version"]
description = "Git-like sync CLI for eLabFTW (local-first push/pull of Markdown/HTML lab notes)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "requests>=2.31",
  "keyring>=25",
  "tomli-w>=1.0",
  "tomli>=2.0; python_version < '3.11'",
  "pyyaml>=6.0",
  # Not imported; requests uses its CA bundle. Floor drops the compromised eMudhra intermediates.
  "certifi>=2026.10.19",
]

[project.scripts]
elport = "elport.cli:main"

[project.urls]
Repository = "https://github.com/youthesame/elport"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>0\\.1\\.(?:0|[1-9][0-9]*))$"

[tool.hatch.version.raw-options]
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--abbrev=40",
  "--match",
  "v0.1.[0-9]*",
  "--exclude",
  "v0.1.*[!0-9]*",
  "--exclude",
  "v0.1.0[0-9]*",
]

[project.optional-dependencies]
dev = [
  "hypothesis[crosshair]>=6.130",
  "pre-commit>=4.6.0",
  "pytest>=9.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16",
  "tomli>=2.0",
  "ty>=0.0.69",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
  "symbolic: pure-Python property tests suited to fast CrossHair exploration",
]
