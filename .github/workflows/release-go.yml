name: Release Go

on:
  push:
    tags:
      - "v*"
      - "!v0.1.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Go release tag and main branch ancestry
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = "tag" || {
            echo "Expected a tag ref, got: $REF_TYPE" >&2
            exit 1
          }
          case "$TAG_NAME" in
            v0.1.*)
              echo "v0.1.* tags belong to the Python release workflow: $TAG_NAME" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$TAG_NAME" | grep -Eq '^v0\.([2-9]|[1-9][0-9]+)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$' || {
            echo "Tag must match v0.<minor>=2.<patch>[-(alpha|beta|rc).<n>] without leading zeros: $TAG_NAME" >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Tagged commit $(git rev-parse HEAD) is not on main" >&2
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify ldflags --version matches tag
        env:
          CGO_ENABLED: "0"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/youthesame/elport/internal/cli.Version=${TAG_NAME#v}" -o /tmp/elport-check ./cmd/elport
          got="$(/tmp/elport-check --version)"
          want="elport ${TAG_NAME#v}"
          test "$got" = "$want" || {
            echo "Version mismatch: got '$got', want '$want'" >&2
            exit 1
          }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
