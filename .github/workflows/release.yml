name: Release

on:
  push:
    tags: ["v0.1.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag and maintenance branch ancestry
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = "tag" || {
            echo "Expected a tag ref, got: $REF_TYPE" >&2
            exit 1
          }
          printf '%s\n' "$TAG_NAME" | grep -Eq '^v0\.1\.[0-9]+$' || {
            echo "Tag must match v0.1.<patch>: $TAG_NAME" >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/python:refs/remotes/origin/python
          git merge-base --is-ancestor HEAD refs/remotes/origin/python || {
            echo "Tagged commit $(git rev-parse HEAD) is not on the python maintenance branch" >&2
            exit 1
          }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv build

      - name: Check the wheel's version matches the tag
        run: test "$(uvx --from dist/*.whl elport --version)" = "elport ${GITHUB_REF_NAME#v}"

      - run: uv publish --trusted-publishing always
