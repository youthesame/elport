name: Release

# Push a `v*` tag to publish that commit to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0

      - run: uv build

      # Run the built wheel in isolation and check its version matches the tag.
      - name: smoke test
        run: |
          got=$(uvx --from dist/*.whl elport --version)
          echo "$got"
          test "$got" = "elport ${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: no PyPI token is stored anywhere.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10.1.0

      - run: uv publish --trusted-publishing always
