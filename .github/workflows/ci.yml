name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release-go.yml gates publishing on these checks.

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt check
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: arch & guardrails
        run: go test -v -run TestArch .

      - name: Quint ITF vector replay
        run: go test -v -run TestQuintITFTracesReplayAgainstGoSync ./internal/sync

      - name: go test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: go test (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/elport

  go-release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check

      - name: GoReleaser snapshot build (no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean

      - name: Verify snapshot archives, checksums, and binary --version
        run: |
          test -s dist/checksums.txt
          test "$(wc -l < dist/checksums.txt)" -eq 6
          (cd dist && sha256sum -c checksums.txt)
          ./dist/elport_linux_amd64_v1/elport --version | grep -Eq '^elport 0\.0\.0-snapshot\.[0-9a-f]+$'
