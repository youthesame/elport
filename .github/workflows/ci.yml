name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml gates publishing on these checks.

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and type checks do not depend on the OS or Python version: run them once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      # setup-uv stopped publishing major tags at v8; pin the full version.
      # Caching defaults to `auto`, which is what we want here.
      - uses: astral-sh/setup-uv@v10.2.0

      # --locked fails the build if uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: ty check
        run: uv run ty check src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; macOS and Windows at the oldest and
        # newest stable Python, which is where platform differences show up.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --extra dev

      - run: uv run pytest
