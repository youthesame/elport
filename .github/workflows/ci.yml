name: CI

on:
  push:
    branches: [main, python]
  pull_request:
  workflow_call: # release.yml gates publishing on these checks.

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and type checks do not depend on the OS or Python version: run them once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      # Actions are pinned to a commit: a tag can be moved to other code, and
      # release.yml runs these steps with the right to publish.
      # Caching defaults to `auto`, which is what we want here.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --locked fails the build if uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: ty check
        run: uv run ty check src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; macOS and Windows at the oldest and
        # newest stable Python, which is where platform differences show up.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked --extra dev

      - run: uv run pytest

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt check
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: arch & guardrails
        run: go test -v -run TestArch .

      - name: Quint ITF vector replay
        run: go test -v -run TestQuintITFTracesReplayAgainstGoSync ./internal/sync

      - name: go test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: go test (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/elport

  go-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags.

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv sync --locked

      - name: Python vs Go differential and state round-trip tests
        env:
          ELPORT_DIFF_REQUIRE: "1"
        run: go test -v -race -count=1 ./internal/difftest/...

  go-release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check

      - name: GoReleaser snapshot build (no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean

      - name: Verify snapshot archives, checksums, and binary --version
        run: |
          test -s dist/checksums.txt
          test "$(wc -l < dist/checksums.txt)" -eq 6
          (cd dist && sha256sum -c checksums.txt)
          ./dist/elport_linux_amd64_v1/elport --version | grep -Eq '^elport [0-9]+\.[0-9]+\.[0-9]+.*-next$'
