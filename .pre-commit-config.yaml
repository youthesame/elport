repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt check
        entry: bash -c 'test -z "$(gofmt -l .)"'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-arch
        name: go arch guardrails
        entry: go test -run TestArch .
        language: system
        types_or: [go, markdown]
        pass_filenames: false
