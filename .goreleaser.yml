version: 2

project_name: elport

builds:
  - id: elport
    main: ./cmd/elport
    binary: elport
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/youthesame/elport/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - README_JA.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "0.0.0-snapshot.{{ .ShortCommit }}"

changelog:
  use: github-native

release:
  prerelease: auto

homebrew_casks:
  - name: elport
    ids:
      - default
    binaries:
      - elport
    homepage: https://github.com/youthesame/elport
    description: Git-like sync CLI for eLabFTW
    skip_upload: auto
    repository:
      owner: youthesame
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/elport"]
          end
